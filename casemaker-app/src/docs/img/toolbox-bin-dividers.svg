<svg xmlns="http://www.w3.org/2000/svg" width="480" height="280" viewBox="0 0 480 280" role="img" aria-labelledby="t d">
  <title id="t">A toolbox bin with dividers inside it and its lid above</title>
  <desc id="d">A toolbox bin seen from above, its floor divided into pockets of different sizes by thin drop-in dividers, one pocket labelled as sized to a particular tool. The bin's lid floats above it.</desc>
  <style>
    .bg { fill: #0b1326; }
    .bin { fill: #16213a; stroke: #ffb786; stroke-width: 2; }
    .lid { fill: #1c2a4a; stroke: #ffb786; stroke-width: 2; }
    .divider { stroke: #ffb786; stroke-width: 2; }
    .leader { stroke: #dae2fd; stroke-width: 1; stroke-dasharray: 3 3; opacity: 0.7; }
    .pocket-hi { fill: #ffb786; opacity: 0.18; }
    .label { fill: #dae2fd; font: 13px system-ui, sans-serif; }
    .label-accent { fill: #ffb786; font: 13px system-ui, sans-serif; font-weight: 600; }
  </style>
  <rect class="bg" width="480" height="280"/>

  <!-- Lid, lifted above the bin -->
  <rect class="lid" x="40" y="36" width="200" height="18" rx="2"/>
  <text class="label" x="52" y="30">lid</text>
  <line class="leader" x1="140" y1="54" x2="140" y2="78"/>

  <!-- The bin, seen from above -->
  <rect class="bin" x="40" y="80" width="200" height="150" rx="4"/>
  <text class="label" x="52" y="100">bin</text>

  <!-- Drop-in dividers, forming pockets of different sizes -->
  <line class="divider" x1="120" y1="80" x2="120" y2="230"/>
  <line class="divider" x1="180" y1="80" x2="180" y2="160"/>
  <line class="divider" x1="120" y1="160" x2="240" y2="160"/>
  <line class="divider" x1="180" y1="190" x2="240" y2="190"/>

  <!-- One pocket, sized to a tool -->
  <rect class="pocket-hi" x="121" y="81" width="58" height="78"/>
  <text class="label-accent" x="126" y="115">sized to</text>
  <text class="label-accent" x="126" y="130">your tool</text>

  <!-- Divider and pocket labels, with leaders into the bin -->
  <text class="label" x="252" y="120">divider</text>
  <line class="leader" x1="248" y1="116" x2="182" y2="116"/>
  <text class="label" x="252" y="200">pocket</text>
  <line class="leader" x1="248" y1="196" x2="205" y2="196"/>

  <text class="label" x="40" y="252">The bin and lid register on each other with no connector.</text>
  <text class="label" x="40" y="268">Each divider is its own printed part and lifts out on its own.</text>
</svg>

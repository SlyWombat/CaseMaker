    <!-- Issue #84 — Industrial Parametric type stack.
         #330 — SPACE GROTESK, INTER AND JETBRAINS MONO ARE SERVED FROM HERE, not from Google Fonts.
         The desktop shell's CSP is `default-src 'self'` with no `font-src` and no remote style
         origin, so the Google Fonts stylesheet was refused there and the app silently fell back to
         the system stack. The three variable woff2 files and their OFL licences live in
         `public/fonts/`, and Vite rewrites this root-absolute href with `base` at build time
         (`/fonts/fonts.css` here, `/casemaker/fonts/fonts.css` on the cPanel deploy); the woff2
         URLs inside that stylesheet are relative to it, so they follow it anywhere. -->
    <link rel="stylesheet" href="/fonts/fonts.css" />

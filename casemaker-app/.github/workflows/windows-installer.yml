name: Windows installer

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: casemaker-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: casemaker-app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            casemaker-app/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('casemaker-app/src-tauri/Cargo.toml') }}

      - name: Install npm deps
        run: npm ci

      # NOT `npx tauri icon`: re-running that in this repo is not a no-op (it resamples every
      # checked-in PNG differently and drops android/ios trees in), and it would write a 6-size
      # icon.ico over the 8-size one — silently bringing back the 20/40 gap. The icons are
      # committed; this only guarantees the .ico still carries all eight sizes before we build.
      - name: Check the Windows icon carries every size
        run: npm run icons

      - name: Build SPA + Tauri Windows bundle
        run: npm run tauri:build

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: case-maker-windows-nsis
          path: casemaker-app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

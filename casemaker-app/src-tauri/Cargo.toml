[package]
name = "casemaker"
version = "0.1.0"
description = "Parametric 3D-printable enclosure designer for microcontrollers and SBCs"
authors = ["SlyWombat"]
edition = "2021"
# 1.89 is where `File::try_lock` / `std::fs::TryLockError` stabilized, and `house.rs` uses them for
# the single-instance lock (#321). A `rust-version` that the code does not honour is a promise to
# nobody.
rust-version = "1.89"

[lib]
name = "casemaker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "io-util", "time"] }
# `json` is for the house service (#306): `axum::Json` and the JSON error bodies. Without it the
# extractor and the response type are simply not in the crate. `original-uri` is the same service's
# 404, which names the path it refused rather than answering "not found" to a typo.
axum = { version = "0.7", default-features = false, features = ["http1", "json", "original-uri", "tokio"] }
# `util` is `ServiceExt::oneshot`, which is how the route tests drive the real router in-process
# rather than binding a socket and racing it.
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["set-header", "trace"] }
mime_guess = "2"
rust-embed = { version = "8", features = ["debug-embed", "include-exclude"] }
clap = { version = "4", features = ["derive"] }
dirs = "5"
log = "0.4"
env_logger = "0.11"
# The Makera catalogue import (#308) is the only reader of Studio's SQLite library. `bundled`
# compiles SQLite from source rather than linking whatever the host has: the same reader then works
# on every platform this ships for, and the C toolchain it needs is already required to build the
# rest of the app. The connection is opened READ_ONLY, over a copy (see `catalogue.rs`).
rusqlite = { version = "0.40.2", features = ["bundled"] }
# One `syncedAt` timestamp. Taken as a dependency rather than hand-rolling civil-date arithmetic,
# which is a place to be quietly wrong about a value the user reads.
chrono = "0.4.45"

[dev-dependencies]
# `config.rs`'s tests have used this since the first commit without it ever being declared, so
# `cargo test --lib` did not compile at all until now (found while testing #299).
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" role="img" aria-labelledby="t d">
  <title id="t">A toolbox bin, lid, and a tray pocketed with dividers</title>
  <desc id="d">A toolbox bin with its lid lifted above it, and beside them a tray divided into pockets of different sizes by a grid of thin dividers, one pocket labelled as sized to a particular tool.</desc>
  <style>
    .bg { fill: #0b1326; }
    .bin { fill: #16213a; stroke: #ffb786; stroke-width: 2; }
    .lid { fill: #1c2a4a; stroke: #ffb786; stroke-width: 2; }
    .tray { fill: #16213a; stroke: #dae2fd; stroke-width: 2; }
    .divider { stroke: #ffb786; stroke-width: 2; }
    .pocket-hi { fill: #ffb786; opacity: 0.18; }
    .label { fill: #dae2fd; font: 13px system-ui, sans-serif; }
    .label-accent { fill: #ffb786; font: 13px system-ui, sans-serif; font-weight: 600; }
  </style>
  <rect class="bg" width="480" height="280"/>

  <!-- Bin -->
  <path class="bin" d="M40 230 L40 140 Q40 130 50 130 L170 130 Q180 130 180 140 L180 230 Z"/>
  <text class="label" x="55" y="250">bin</text>

  <!-- Lid, lifted above -->
  <rect class="lid" x="35" y="90" width="150" height="18" rx="2"/>
  <text class="label" x="55" y="85">lid</text>
  <path class="divider" d="M110 108 L110 128" stroke-dasharray="4 4" opacity="0.6"/>

  <!-- Tray, shown separately to the right with its dividers -->
  <rect class="tray" x="240" y="60" width="200" height="140" rx="4"/>
  <text class="label" x="240" y="50">tray</text>

  <!-- Dividers forming pockets of different sizes -->
  <line class="divider" x1="300" y1="60" x2="300" y2="200"/>
  <line class="divider" x1="360" y1="60" x2="360" y2="140"/>
  <line class="divider" x1="300" y1="140" x2="440" y2="140"/>
  <line class="divider" x1="360" y1="170" x2="440" y2="170"/>

  <!-- Highlight one pocket, sized to a tool -->
  <rect class="pocket-hi" x="301" y="61" width="58" height="78"/>
  <text class="label-accent" x="305" y="105">sized to</text>
  <text class="label-accent" x="305" y="120">your tool</text>

  <text class="label" x="240" y="220">divider</text>
  <text class="label" x="240" y="236">pocket</text>

  <text class="label" x="40" y="268">The bin, lid and tray register on each other with no connector; each divider lifts out on its own.</text>
</svg>
